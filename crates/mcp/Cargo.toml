[package]
name = "pluma-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts pluma-text bundles for documents, through the engine's `bundled-fonts`, as
# pluma-ui-egui's. Off, for an embedder that supplies every document font at run time.
bundled-fonts = ["pluma-engine/bundled-fonts"]

[dependencies]
pluma-engine = { workspace = true }
pluma-render = { workspace = true }
pluma-svg = { workspace = true }
pluma-format = { workspace = true }
pluma-tools = { workspace = true }
pluma-geom = { workspace = true }
pluma-doc = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

image = { workspace = true }

[dev-dependencies]
pluma-testkit = { workspace = true }
proptest = { workspace = true }
socket2 = { workspace = true }
