[package]
name = "pluma-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
pluma-geom = { workspace = true }
pluma-color = { workspace = true }
pluma-doc = { workspace = true }
pluma-brush = { workspace = true }
pluma-pathops = { workspace = true }
pluma-effects = { workspace = true }
pluma-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
pluma-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
