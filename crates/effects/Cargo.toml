[package]
name = "pluma-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma live effects evaluated to geometry"

[lints]
workspace = true

[dependencies]
pluma-geom = { workspace = true }
pluma-three-d = { workspace = true }
pluma-doc = { workspace = true }
pluma-pathops = { workspace = true }
pluma-text = { workspace = true }
pluma-plugins = { workspace = true }
image = { workspace = true }
kurbo = { workspace = true }
# Effect › SVG Filters draws its filters with resvg (MIT OR Apache-2.0), at the usvg version the
# workspace reads SVG with; raster-images decodes the object's pixels it hands the filter as a PNG.
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
# The number lists of filter attributes, read as usvg reads them (MIT OR Apache-2.0; already used by usvg).
svgtypes = "0.16"
serde_json = { workspace = true }

[dev-dependencies]
pluma-color = { workspace = true }
