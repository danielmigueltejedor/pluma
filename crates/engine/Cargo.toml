[package]
name = "pluma-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma engine: sessions, history, selection, the command registry"

[lints]
workspace = true

[features]
default = ["bundled-fonts", "heif"]
# The fonts pluma-text bundles (see its `bundled-fonts`). Embedders that supply every font at
# run time (`pluma_text::FontDb::add_font`) build with `default-features = false`.
bundled-fonts = ["pluma-text/bundled-fonts"]
# HEIC and HEIF images open and place, decoded by heic-rs (an HEVC decoder). A build without this
# feature still recognizes the files and refuses them with a message. The apps list it beside
# `bundled-fonts`.
heif = ["dep:heic-rs", "dep:rayon"]

[dependencies]
# Which paths stored in documents may be opened.
craft-docpath = { workspace = true }
craft-proof = { workspace = true }
pluma-geom = { workspace = true }
pluma-color = { workspace = true }
pluma-doc = { workspace = true }
pluma-tools = { workspace = true }
pluma-text = { workspace = true }
pluma-render = { workspace = true }
pluma-pathops = { workspace = true }
pluma-brush = { workspace = true }
pluma-trace = { workspace = true }
pluma-svg = { workspace = true }
pluma-format = { workspace = true }
pluma-pdf = { workspace = true }
pluma-cad = { workspace = true }
pluma-eps = { workspace = true }
pluma-metafile = { workspace = true }
pluma-plugins = { workspace = true }
pluma-affinity = { workspace = true }
pluma-scriptcheck = { workspace = true }
pluma-js = { workspace = true }
# The commands' parameter schemas (schemas.rs).
pluma-apischema = { workspace = true }
image = { workspace = true }
jxl-oxide = { workspace = true }
jxl-color = { workspace = true }
jxl-grid = { workspace = true }
hayro-jpeg2000 = { version = "=0.3.5", default-features = false, features = ["std", "simd"] }
# Pure Rust, no unsafe; pinned at the version lienzo-heif uses.
heic-rs = { version = "=0.1.4", default-features = false, features = ["std"], optional = true }
flate2 = { workspace = true }
chrono = { workspace = true }
# The XML parts of Word documents placed as type (place/docx.rs).
roxmltree = "0.21"
# The compound file that holds a Word 97-2003 document placed as type (place/doc.rs).
cfb = "0.15"
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Whether a recovery area folder is this account's own (`FolderStore::own_area`). Already in
# Cargo.lock (tempfile, ui-egui), so this adds no new crate.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

# The tiles of a HEIC photo decode in parallel on native; wasm stays single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
heic-rs = { version = "=0.1.4", default-features = false, features = ["std", "parallel"], optional = true }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
pluma-affinity = { workspace = true, features = ["synth"] }
crc32fast = { workspace = true }
pluma-testkit = { workspace = true }
proptest = { workspace = true }
# A variable font built in code (no font file is committed).
pluma-text = { workspace = true, features = ["test-fonts"] }
# How many times an open reads a PDF.
pluma-pdf = { workspace = true, features = ["read-count"] }
wat = { workspace = true }
# Zstandard streams for the Illustrator editing data fuzz tests.
ruzstd = { workspace = true }
# JPEG XL files for the `.jxl` open and place tests.
zune-jpegxl = { workspace = true }
zune-core = { workspace = true }
# The JavaScript parser's lexer, compared with the script checker's on the same scripts.
pluma-js = { workspace = true }
# A bundled font's own glyph boxes, for the glyph bounds tests.
skrifa = { workspace = true }
