[package]
name = "pluma-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
pluma-geom = { workspace = true }
pluma-color = { workspace = true }
pluma-doc = { workspace = true }
pluma-effects = { workspace = true }
# The editing data for other apps writes clipped art cut to its clipping path.
pluma-pathops = { workspace = true }
pluma-brush = { workspace = true }
pluma-text = { workspace = true }
# The glyph outlines of Type 42 fonts a composite font shows.
skrifa = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
pluma-metafile = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
pluma-pdf = { workspace = true }
# The predefined CMaps that strings of legacy type in CJK fonts are decoded by.
craft-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
pluma-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
# Images read through `CCITTFaxDecode`.
hayro-ccitt = { workspace = true }
# Live effects' params, as the art styles that name them give them.
serde_json = { workspace = true }
# Substring search for PostScript `search`.
memchr = { workspace = true }
# Names in legacy .ai files that aren't UTF-8, read in the encoding the user picks.
encoding_rs = { workspace = true }

[dev-dependencies]
pluma-testkit = { workspace = true }
pluma-text = { workspace = true, features = ["test-fonts"] }
# Tests: a Group 4 encoder and the T.4 run codes, to write CCITT test images.
fax = "0.2"
