[package]
name = "pluma-metafile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma Windows metafiles: hand-written EMF and WMF writers and readers"

[lints]
workspace = true

[dependencies]
pluma-geom = { workspace = true }
pluma-color = { workspace = true }
pluma-doc = { workspace = true }
pluma-effects = { workspace = true }
pluma-brush = { workspace = true }
pluma-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
pluma-text = { workspace = true, features = ["bundled-fonts"] }
