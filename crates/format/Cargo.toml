[package]
name = "pluma-format"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluma native .pluma format (versioned JSON, embedded images)"

[lints]
workspace = true

[dependencies]
pluma-doc = { workspace = true }
craft-vectorcraft-format = { workspace = true }
serde ={ workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }

# A plain fsync where a volume refuses the full flush (`sync_file`, atomic.rs), and the replaced
# file's access ACL on Linux (`keep_permissions`). Already in Cargo.lock (tempfile), so this adds
# no new crate.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "fs"] }

[dev-dependencies]
pluma-testkit = { workspace = true }
proptest = { workspace = true }
pluma-geom = { workspace = true }
